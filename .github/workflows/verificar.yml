# Verificação automática antes de publicar: roda a cada push e pull request.
# Se falhar, o GitHub marca o commit com ✗ e o deploy não deve ser feito.
#
#   1. tipos (TypeScript)      — erro de digitação de campo, prop faltando
#   2. lint (ESLint)           — erros de React/Next; avisos não barram
#   3. auditoria das rotas     — rota de escrita sem sessão, SQL montado com texto,
#                                upload sem limite de tamanho (scripts/audita-rotas.mjs)
#   4. build de produção       — o mesmo `npm run build` que o Dokploy roda
#
# Não precisa de nenhum segredo: o build não depende das envs do Supabase
# (as páginas buscam dados na hora da requisição). Os testes de ponta a ponta
# (`npm run testa`) precisam do site e do banco no ar e rodam na homologação.
name: Verificar

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: verificar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: teste-local
        ports:
          - 5432
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Tipos
        run: npx next typegen && npx tsc --noEmit

      - name: Testar recorte de camadas
        run: |
          node --experimental-strip-types --test scripts/testa-satelite-nuvens.mjs
          node scripts/testa-recorte-camadas.mjs
          node scripts/testa-consulta-rural-recorte.mjs
          node scripts/testa-relatorio-area.mjs
          node scripts/testa-limites-rotas.mjs
          node --test scripts/testa-chat-ponto-entradas.mjs

      - name: Conferir recortes urbanos e calibração CAD
        env:
          ARINI_TESTE_CARTEIRA_DB: postgresql://postgres:teste-local@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/postgres
        run: |
          node scripts/testa-recortes-cad.mjs
          node --test scripts/testa-privacidade-espelho.mjs
          node --test scripts/testa-insumos-nota.mjs

      - name: Testar assinaturas, cartão e emissão fiscal com dados sintéticos
        env:
          ARINI_TESTE_CARTEIRA_DB: postgresql://postgres:teste-local@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/postgres
        run: node --test --test-concurrency=1 scripts/testa-assinaturas-planos.mjs scripts/testa-contratacao-direta.mjs scripts/testa-financeiro.mjs scripts/testa-nfse-assinaturas.mjs scripts/testa-privacidade-publicacao.mjs scripts/testa-divulgadores.mjs scripts/testa-tarefas-automaticas.mjs scripts/testa-crm-comercial.mjs

      # Banco efêmero e provedores substituídos nos handlers; sem cobranças externas.
      - name: Testar regressões de operação e permissões
        env:
          ARINI_TESTE_CARTEIRA_DB: postgresql://postgres:teste-local@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/postgres
        run: node --test --test-concurrency=1 scripts/testa-alugueis-api.mjs scripts/testa-alugueis-sql.mjs scripts/testa-atendimento-api.mjs scripts/testa-atendimento-crm-sql.mjs scripts/testa-crm-setores-api.mjs scripts/testa-equipe-leitura.mjs scripts/testa-matriz-origens.mjs scripts/testa-automacoes-api.mjs scripts/testa-suporte-avaliacao.mjs scripts/testa-matriz-redistribuicao.mjs scripts/testa-atendimento-horario.mjs scripts/testa-robo-whatsapp.mjs scripts/testa-contratacao-emissao.mjs scripts/testa-pedido-perfil.mjs scripts/testa-inicio-hidratacao.mjs scripts/testa-login-perfil.mjs

      - name: Lint
        run: npm run lint

      - name: Auditoria das rotas
        run: npm run audita

      - name: Build de produção
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
